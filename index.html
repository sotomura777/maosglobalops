<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0B" />
    <!-- Aplica o modo claro/escuro antes de a app carregar (ver src/theme.js). -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem("gop-theme") || "auto";
          var t = p === "light" || p === "dark" ? p : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          document.documentElement.dataset.theme = t;
          if (t === "light") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#F7F4EF");
        } catch (e) {}
      })();
    </script>
    <title>MaosGlobalOps — A rede do staff de eventos</title>
    <meta name="description" content="O teu perfil profissional de eventos: experiência validada por empresas, disponibilidade num só sítio, trabalhos e rankings nacionais." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Pré-visualização ao partilhar (WhatsApp, redes). O endereço tem de ser absoluto:
         mudar se a app passar a ter domínio próprio. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MaosGlobalOps" />
    <meta property="og:locale" content="pt_PT" />
    <meta property="og:title" content="MaosGlobalOps — A rede do staff de eventos" />
    <meta property="og:description" content="O teu próximo trabalho em eventos e restauração. Encontra ofertas, candidata-te e constrói o teu currículo verificado." />
    <meta property="og:image" content="https://maosglobalops.web.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo MaosGlobalOps: o O de MAOS em forma de globo, em dourado sobre preto" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
